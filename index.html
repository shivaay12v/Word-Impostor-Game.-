
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImpostorVerse</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101322;color:white;font-family:Arial,sans-serif;text-align:center;padding:20px}
h1{color:#a78bfa;font-size:34px}
.card{background:#20263b;padding:20px;border-radius:18px;margin:15px auto;max-width:450px}
input,select,button{width:100%;padding:13px;margin:7px 0;border:0;border-radius:10px;font-size:16px}
button{background:#8b5cf6;color:white;font-weight:bold}
button:active{opacity:.8}
input,select{background:#fff;color:#111}
.hidden{display:none}
.player{background:#303851;padding:12px;border-radius:9px;margin:7px}
.big{font-size:25px;font-weight:bold;padding:30px}
small{color:#c4b5fd}
</style>
</head>
<body>

<h1>🕵️ ImpostorVerse</h1>
<p>Find the impostor among your friends!</p>

<div id="setup" class="card">
<h2>New Game</h2>
<input id="playerName" placeholder="Enter player name">
<button onclick="addPlayer()">➕ Add Player</button>
<div id="playerList"></div>

<label>Number of impostors</label>
<select id="impostorCount">
<option value="1">1 Impostor</option>
<option value="2">2 Impostors</option>
<option value="3">3 Impostors</option>
</select>

<label>Category</label>
<select id="category">
<option value="Animals">Animals</option>
<option value="Food">Food</option>
<option value="Places">Places</option>
<option value="Objects">Objects</option>
<option value="Mixed">Mixed</option>
</select>

<button onclick="startGame()">START GAME 🚀</button>
</div>

<div id="reveal" class="card hidden">
<h2 id="turnTitle"></h2>
<p>Pass the phone to this player.</p>
<button onclick="revealWord()">REVEAL MY WORD</button>
<h1 id="secretWord" class="big"></h1>
<button id="nextButton" class="hidden" onclick="nextPlayer()">HIDE & NEXT</button>
</div>

<div id="discussion" class="card hidden">
<h2>🗣️ Discussion Time!</h2>
<p>Everyone give one clue. Discuss who might be the impostor.</p>
<button onclick="startVoting()">START VOTING</button>
</div>

<div id="voting" class="card hidden">
<h2 id="voteTitle">Vote privately</h2>
<div id="voteOptions"></div>
</div>

<div id="results" class="card hidden">
<h2 id="winner"></h2>
<h3>🏆 Scores</h3>
<div id="scores"></div>
<button onclick="newGame()">PLAY AGAIN</button>
</div>

<script>
const words={
Animals:["Tiger","Elephant","Dolphin","Lion","Penguin","Giraffe"],
Food:["Pizza","Burger","Mango","Chocolate","Biryani","Sandwich"],
Places:["School","Hospital","Airport","Beach","Cinema","Museum"],
Objects:["Laptop","Chair","Clock","Camera","Umbrella","Bicycle"]
};

let players=[];
let roles=[];
let secret="";
let turn=0;
let votes=[];
let voter=0;
let points={};

function addPlayer(){
let name=document.getElementById("playerName").value.trim();
if(!name)return;
if(players.includes(name)){alert("Name already added");return;}
players.push(name);
points[name]=points[name]||0;
document.getElementById("playerName").value="";
renderPlayers();
}

function renderPlayers(){
document.getElementById("playerList").innerHTML=players.map((p,i)=>
`<div class="player">${i+1}. ${escapeHTML(p)} <button onclick="removePlayer(${i})">Remove</button></div>`).join("");
}

function escapeHTML(s){
return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function removePlayer(i){
players.splice(i,1);
renderPlayers();
}

function startGame(){
let count=Number(document.getElementById("impostorCount").value);
if(players.length<3){alert("Add at least 3 players!");return;}
if(count>=players.length){alert("There must be at least one normal player.");return;}

let category=document.getElementById("category").value;
let list=category==="Mixed"?Object.values(words).flat():words[category];
secret=list[Math.floor(Math.random()*list.length)];

let shuffled=[...players].sort(()=>Math.random()-.5);
let impostors=shuffled.slice(0,count);
roles=players.map(p=>({name:p,impostor:impostors.includes(p)}));

turn=0;
document.getElementById("setup").classList.add("hidden");
document.getElementById("reveal").classList.remove("hidden");
showTurn();
}

function showTurn(){
document.getElementById("turnTitle").textContent=players[turn]+"'s turn";
document.getElementById("secretWord").textContent="";
document.getElementById("nextButton").classList.add("hidden");
}

function revealWord(){
let role=roles[turn];
document.getElementById("secretWord").textContent=role.impostor?"🕵️ YOU ARE THE IMPOSTOR":secret;
document.getElementById("nextButton").classList.remove("hidden");
}

function nextPlayer(){
turn++;
if(turn<players.length){showTurn();}
else{
document.getElementById("reveal").classList.add("hidden");
document.getElementById("discussion").classList.remove("hidden");
}
}

function startVoting(){
votes=[];
voter=0;
document.getElementById("discussion").classList.add("hidden");
document.getElementById("voting").classList.remove("hidden");
showVote();
}

function showVote(){
document.getElementById("voteTitle").textContent=players[voter]+", vote privately";
let options=players.map((p,i)=>i===voter?"":`<button onclick="castVote(${i})">${escapeHTML(p)}</button>`).join("");
document.getElementById("voteOptions").innerHTML=options;
}

function castVote(i){
votes.push(i);
voter++;
if(voter<players.length){showVote();}
else{showResults();}
}

function showResults(){
document.getElementById("voting").classList.add("hidden");
document.getElementById("results").classList.remove("hidden");

let counts=players.map((p,i)=>votes.filter(v=>v===i).length);
let max=Math.max(...counts);
let leaders=counts.map((n,i)=>n===max?i:-1).filter(i=>i>=0);
let caught=leaders.every(i=>roles[i].impostor);

if(caught){
document.getElementById("winner").textContent="🎉 PLAYERS WIN!";
players.forEach(p=>points[p]=(points[p]||0)+1);
}else{
document.getElementById("winner").textContent="🕵️ IMPOSTOR WINS!";
roles.filter(r=>r.impostor).forEach(r=>points[r.name]=(points[r.name]||0)+1);
}

document.getElementById("scores").innerHTML=players.map(p=>
`<div class="player">${escapeHTML(p)} — ${points[p]} points</div>`).join("");
}

function newGame(){
document.getElementById("results").classList.add("hidden");
document.getElementById("setup").classList.remove("hidden");
renderPlayers();
}
</script>
</body>
</html>
